[workspace]
resolver = "2"
members = [
    "crates/abora-core",
    "crates/abora-update",
    "crates/abora-config",
    "crates/abora-log",
    "crates/abora-sysinfo",
    "crates/abora-api",
    "services/aborad",
    "cli/abora",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Abora"]
description = "Abora Framework - shared server foundation for Abora Cloud and Abora Atlas"

# Shared dependency versions. Individual crates opt into only what they need.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
axum = "0.8"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
clap = { version = "4.5", features = ["derive"] }
ureq = "3.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"