name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Stamped into aborad's /api/v1/version as `git_commit` (see docs/daemon-api.md).
  ABORA_BUILD_COMMIT: ${{ github.sha }}

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Installer and systemd unit
        run: |
          cargo build --release --locked -p aborad -p abora -p abora-apply
          scripts/check-installer.sh

  apply:
    name: apply updates (real apt in Docker)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Upgrade a real .deb through aborad and abora-apply
        run: scripts/test-apply-docker.sh

  systemd:
    name: real install and systemd units (Docker)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install, start under systemd, apply a real upgrade, uninstall
        run: scripts/test-systemd-docker.sh

  nix:
    name: Nix flake, modules and installer
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Real Nix on the runner (not the Docker image used for local dev, which has no cache): ANIX and
      # TinyPM build from source, and magic-nix-cache makes that incremental instead of ~30 minutes every run.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: sh scripts/docker/nix-test.sh

  iso:
    name: live ISO boots
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static cpio genisoimage qemu-system-x86
      - name: Boot the ISO headless and check aborad answers
        # No KVM on hosted runners, so QEMU emulates the CPU; give it time.
        run: make boot-test ABORA_QEMU_TIMEOUT=90
        env:
          ABORA_QEMU_TIMEOUT: "90"
      - name: Screenshot of the boot screen
        if: always()
        run: make screenshot ABORA_QEMU_SETTLE=40
        env:
          ABORA_QEMU_SETTLE: "40"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-boot
          path: |
            build/serial.log
            build/screen.ppm
