# Limine configuration for the Abora Framework live ISO.
# Copied to /boot/limine/limine.conf by scripts/make-iso.sh.

# Boot straight through: this is a live demo, not an installer.
timeout: 0

# ABORA-SYSTEM-FILE 2: rename the boot entry below to your fork's name
/Abora Framework
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.cpio.gz
    resolution: 1280x800
    # console=ttyS0 only: kernel messages go to the serial line and to the boot
    # screen (via /dev/kmsg), and never scribble over the logo through fbcon.
    cmdline: console=ttyS0,115200 loglevel=7 vt.global_cursor_default=0 consoleblank=0 rdinit=/init
